events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream next {
        server web:3000;
    }
    upstream api {
        server api:8000;
    }
    upstream minio {
        server minio:9000;
    }

    # HTTP: certbot challenge + redirect to HTTPS
    server {
        listen 80;
        server_name expo.atocomm.eu n8n.atocomm.eu;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name expo.atocomm.eu;
        client_max_body_size 500M;

        ssl_certificate /etc/letsencrypt/live/expo.atocomm.eu/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/expo.atocomm.eu/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # S3 presigned uploads/downloads (path-style: /<bucket>/<key>).
        # No path rewrite: the SigV4 signature covers the full request path,
        # so the URI must reach MinIO unchanged. Bucket name = S3_BUCKET.
        location /exhibitor-uploads/ {
            proxy_pass http://minio;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            client_max_body_size 500M;
        }

        location /api/ {
            proxy_pass http://api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://next;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # n8n for the ATO Telegram <-> Salesforce integration (separate compose project /opt/ato-n8n,
    # container "ato-n8n" on the expo_default network). Resolved at request time, so nginx starts
    # even when n8n is stopped. Requires the certificate /etc/letsencrypt/live/n8n.atocomm.eu.
    server {
        listen 443 ssl;
        server_name n8n.atocomm.eu;
        client_max_body_size 16M;

        ssl_certificate /etc/letsencrypt/live/n8n.atocomm.eu/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/n8n.atocomm.eu/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        resolver 127.0.0.11 valid=30s ipv6=off;

        location / {
            set $n8n_upstream http://ato-n8n:5678;
            proxy_pass $n8n_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
    }
}
